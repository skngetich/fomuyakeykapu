<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="description" content="Keep a FIBA basketball scoresheet on any device, offline, and export it as a PDF.">
<title>FIBA Scoresheet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>
  // Applied before first paint so the saved theme does not flash the wrong one.
  (function () {
    try {
      var saved = localStorage.getItem('fiba.theme.v1') || 'system';
      var dark = saved === 'dark' ||
        (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
    } catch (e) {
      /* private mode or blocked storage — fall through to the light default */
    }
  })();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="mx-auto flex h-full max-w-[1100px] flex-col">
  <div class="sticky top-0 z-20 flex items-center gap-2 border-b border-line bg-surface px-3 py-2.5 pt-[calc(0.625rem+env(safe-area-inset-top))]">
    <h1 class="m-0 flex-1 text-base font-semibold">FIBA Scoresheet
      <span id="subtitle" class="block text-xs font-normal text-muted">New game</span>
    </h1>
    <button class="btn btn-sm btn-ghost" id="btn-theme" aria-label="Change theme"></button>
    <button class="btn btn-sm btn-ghost" id="btn-games">Games</button>
  </div>
  <div class="flex gap-1 border-b border-line bg-surface px-3 py-2" role="tablist">
    <button class="seg" role="tab" id="tab-setup" aria-selected="true">Setup</button>
    <button class="seg" role="tab" id="tab-live" aria-selected="false">Live</button>
    <button class="seg" role="tab" id="tab-sheet" aria-selected="false">Sheet</button>
  </div>
  <main id="view" class="flex-1 overflow-y-auto p-3 pb-[calc(1.5rem+env(safe-area-inset-bottom))]"></main>
</div>

<!-- Confirm dialog for entries that break a rule -->
<dialog id="dlg-confirm" class="modal">
  <h3 class="mb-2 text-base font-semibold" id="confirm-title">Check this entry</h3>
  <div class="modal-warn" id="confirm-warnings"></div>
  <p class="mt-1.5 text-xs text-muted" id="confirm-body"></p>
  <div class="mt-3.5 flex justify-end gap-2">
    <button class="btn btn-ghost" id="confirm-cancel">Cancel</button>
    <button class="btn btn-primary" id="confirm-ok">Record anyway</button>
  </div>
</dialog>

<!-- Foul entry -->
<dialog id="dlg-foul" class="modal">
  <h3 class="mb-2 text-base font-semibold" id="foul-title">Foul</h3>
  <p class="text-xs text-muted">Type</p>
  <div class="my-2 grid grid-cols-[repeat(auto-fit,minmax(64px,1fr))] gap-1.5" id="foul-types"></div>
  <p class="mt-1.5 text-xs text-muted">Free throws awarded</p>
  <div class="my-2 grid grid-cols-[repeat(auto-fit,minmax(64px,1fr))] gap-1.5" id="foul-ft"></div>
  <div class="mt-3.5 flex justify-end gap-2">
    <button class="btn btn-ghost" id="foul-cancel">Cancel</button>
    <button class="btn btn-primary" id="foul-ok">Record</button>
  </div>
</dialog>

<!-- Saved games -->
<dialog id="dlg-games" class="modal">
  <h3 class="mb-2 text-base font-semibold">Saved games</h3>
  <div id="games-list"></div>
  <div class="mt-3.5 flex justify-end gap-2">
    <button class="btn btn-ghost" id="games-import">Import JSON</button>
    <button class="btn btn-primary" id="games-close">Close</button>
  </div>
</dialog>

<input type="file" id="file-import" accept="application/json,.json" class="hidden">

<!-- The printable scoresheet is rendered here on demand -->
<div id="print-root" aria-hidden="true"></div>

<script type="module" src="app.js"></script>
</body>
</html>
