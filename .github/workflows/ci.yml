name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scoring, foul and sheet rules
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Rebuild the stylesheet
        run: npm run build:css

      # styles.css is committed so the source tree runs without a build. If it no
      # longer matches src/input.css, someone edited the input and forgot to
      # rebuild, and the deployed styles would silently lag behind.
      - name: Check styles.css is up to date
        run: |
          if ! git diff --quiet -- styles.css; then
            echo "::error file=styles.css::styles.css does not match src/input.css. Run 'npm run build:css' and commit the result."
            git diff --stat -- styles.css
            exit 1
          fi

      # Fails if any file app/sw.js promises to precache is missing: that would
      # make the service worker install reject and the app stop working offline.
      - name: Build the site
        run: npm run build:site

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          include-hidden-files: true

  # Production from main; a preview per pull request, linked in a PR comment.
  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    concurrency:
      group: deploy-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'basketball-scoresheet' }}
    steps:
      # Pull requests from forks get no secrets. Skip with an explanation rather
      # than failing on a repository that has not been set up.
      - name: Check for the deploy credentials
        id: cred
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so the deploy was skipped. See the README."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.cred.outputs.present == 'true'
        with:
          name: site
          path: _site

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.cred.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ env.PROJECT }} --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true

      - name: Report the address
        if: steps.cred.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "Deployed to $URL" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR" ]; then
            body="Preview for this pull request: $URL/app/ (landing page: $URL)"
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --body "$body" \
              || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
